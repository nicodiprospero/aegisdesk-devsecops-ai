# Shift-left: os mesmos controles do CI rodando na máquina do dev antes do commit
#   pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-r", "app", "scripts"]
        additional_dependencies: ["bandit[toml]"]
        pass_filenames: false
  - repo: local
    hooks:
      - id: lint-prompts
        name: lint do acervo de prompts
        entry: python scripts/lint_prompts.py
        language: system
        pass_filenames: false
        files: ^prompts/
      - id: check-unicode
        name: Trojan Source (caracteres invisíveis/bidirecionais)
        entry: python scripts/check_unicode.py
        language: system
        pass_filenames: false
